name: Automação Robô de Opções

on:
  schedule:
    # Executa automaticamente de segunda a sexta-feira (às 10:00 UTC)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Permite disparar a execução manualmente a partir do painel do GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pytz

      - name: Executar Rotina de Opções
        run: |
          python robo_opcoes.py
